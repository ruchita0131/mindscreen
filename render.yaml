services:
  # Backend FastAPI Service on Render
  - type: web
    name: mindscreen-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # You will set this in the Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a strong random secret
      - key: HF_TOKEN
        sync: false          # Your Hugging Face token (set in Render dashboard)
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://mindscreen.vercel.app
    autoDeploy: true
